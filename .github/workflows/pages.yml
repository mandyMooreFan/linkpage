# Deploys the builder to GitHub Pages.
#
# Live: every push to `main` publishes. It was dormant through the design phase, when there was
# no builder worth publishing; v1 is built, so it deploys.
#
# The URL is a *project* page — https://<user>.github.io/linkpage/ — which is why
# `packages/builder/vite.config.ts` sets `base: "/linkpage/"`. If this repo is ever renamed or
# moved to a user page, that constant moves with it or every asset 404s.
#
# `workflow_dispatch` stays so a deploy can be forced without an empty commit.
name: Deploy builder to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Bounded, like every other job here (#119): a job with no bound turns a blip somewhere
    # else into six hours of nothing.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/builder/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Bounded, like every other job here (#119): a job with no bound turns a blip somewhere
    # else into six hours of nothing.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
