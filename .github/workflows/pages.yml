# Deploys the builder to GitHub Pages.
#
# DORMANT ON PURPOSE. During the design phase there is no builder worth publishing, so this
# runs only when someone presses "Run workflow" — it will not fire on a merge, and no public
# URL appears until you want one.
#
# To make it live, once the builder is real:
#   1. uncomment the `push` trigger below;
#   2. Settings → Pages → Source: "GitHub Actions";
#   3. confirm `base` in packages/builder/vite.config.ts still matches the repo path.
name: Deploy builder to Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/builder/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
