name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR cancels the run still going for the first one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Active LTS and Current. The floor declared in package.json is 22 — bump that
        # before dropping it from this matrix.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Corepack has to be enabled *after* setup-node, or the shim it installs points at
      # the runner's pre-installed Node instead of the one selected above. That is also why
      # the pnpm store is cached by hand below rather than via setup-node's `cache: pnpm`,
      # which needs pnpm on PATH before it runs.
      - name: Enable Corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ matrix.node }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Check formatting
        run: pnpm format:check
