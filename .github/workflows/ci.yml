name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR cancels the run still going for the first one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # This line takes about a minute. Ten is not a budget, it is the point past which something
    # has gone wrong outside this repository and the answer is a red check rather than a wait —
    # see the note on the end-to-end job below.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Active LTS and Current. The floor declared in package.json is 22.12 (Vite 8's
        # requirement) — bump that before dropping a line from this matrix.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Corepack has to be enabled *after* setup-node, or the shim it installs points at
      # the runner's pre-installed Node instead of the one selected above. That is also why
      # the pnpm store is cached by hand below rather than via setup-node's `cache: pnpm`,
      # which needs pnpm on PATH before it runs.
      - name: Enable Corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ matrix.node }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Check formatting
        run: pnpm format:check

  # `SPEC.md` §5.3's browser tier: the downloaded file is the preview and renders from `file://`
  # with the network off, plus the four accessibility walks that only a browser can make (§7.12).
  # It is a job of its own rather than more steps on the matrix above, because it is the only
  # thing here that needs a browser and it must not put one on the critical path — the Node 24/26
  # lines stay a minute long and stay the fast signal.
  #
  # One Node version, one browser, one worker, no retries. See `packages/builder/playwright.config.ts`.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    #
    # **Bounded, because it once was not** (issue #119). Three runs in one 40-minute window sat on
    # `Install Chromium` for 12, 19 and 37 minutes and had to be cancelled by hand; runs before
    # that window and every run since have finished the whole job well inside a couple of minutes
    # (30 to 70 seconds with the two e2e files of the time; 1m35s to 1m51s with today's five, see
    # `SPEC.md` §5.3 for the per-file cost). Nothing in
    # the repository explains it — a *cold* cache passed on `main` in 72s inside the same window
    # that a *warm* one hung on a branch — so the cause was almost certainly outside it, and
    # transient.
    #
    # **What was wrong here is that nothing said so.** With no bound, a blip somewhere else
    # becomes a job that runs to GitHub's six-hour default, and a check that never returns is
    # worse than one that goes red: `playwright.config.ts` sets `retries: 0` precisely so that a
    # red check can be trusted, and a check that hangs cannot be trusted or acted on at all.
    #
    # A retry around the install was considered and not taken. `retries: 0` is an argument about
    # *browser tests*, whose flakiness hides product bugs, so it does not settle this on its own —
    # but a retry fitted to a cause nobody has established is a workaround nobody will later be
    # able to remove. A bound makes the next occurrence visible and cheap, which is what would
    # have been wanted the first time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version `.nvmrc` pins. The end-to-end is about the browser, not about Node, so
          # running it twice would buy nothing and cost a browser download.
          node-version: 24

      # Same ordering constraint as the matrix job above: Corepack after setup-node.
      - name: Enable Corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-24-

      - run: pnpm install --frozen-lockfile

      # Keyed on the Playwright version because that is what decides which browser build is
      # wanted: a bump invalidates the cache, and nothing else needs to.
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('./packages/builder/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # `restore-keys`, so that a Playwright bump gets a near-miss rather than nothing. The pnpm
      # cache above has had them all along; this one did not, which meant every version bump paid
      # for a completely cold download. A stale hit costs a little disk and saves most of it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      # Chromium's headless shell alone — no Firefox, no WebKit, and not the full headed
      # Chromium either. `--with-deps` runs every time even on a cache hit: the browser binaries
      # are cached but the runner's apt packages are not, and a browser that fails to launch
      # reads as flakiness rather than as the missing library it is.
      #
      # Bounded separately from the job so that the log names *this* step rather than leaving the
      # reader to work out which of six was the slow one.
      #
      # Five minutes is about six times the worst measured cold run: during the same window as
      # #119's hangs, a run on `main` with an empty cache downloaded the browser, ran apt and
      # finished this step in **51 seconds**. So the bound cannot fire on a legitimately slow
      # download — which is the only way a bound like this could make things worse.
      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm --filter @linkpage/builder exec playwright install --with-deps --only-shell chromium

      # Builds the builder and serves `dist` itself — see the `webServer` block in the config.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: packages/builder/test-results/
          retention-days: 7

  # **Whether the two hand-run instruments worked — never what they found** (issue #339,
  # settled on #324).
  #
  # `pnpm shots` (§7.4's appearance ritual) and `pnpm a11y` (§7.12's builder sweep) are reports
  # for a person and remain so: **§7.12's commitments still rest on the five end-to-ends alone,
  # and nothing here gates a finding.** What is gated is whether the instrument *ran and could
  # see*, which SPEC.md §5.3 puts as *failing nothing is about gating, being controlled is about
  # seeing*.
  #
  # **Both already grade their own exits, and until now nothing read the grade.** `review-shots`
  # gained its exit 2 in #270 "for the reader who did not scroll up" — a reader who had never
  # existed. That issue is why this job exists: from `be7aaff` every run printed a skip line,
  # exited 0 by the shell's reckoning, reported a cheerful `70 shots →`, and two frames were
  # absent from every set taken **for three months** while tickets read past the line.
  #
  #   1  could not run at all — no browser, no server, no app      → red
  #   2  frames missing, or "this report cannot be believed"       → red
  #   3  rules violated (a11y only): findings for a person         → GREEN, deliberately
  #
  # **Exit 3 passing is the whole subtlety.** `pnpm a11y` returns 3 today for the three rules
  # #318 records, which the owner ruled to a successor effort. A job that went red on 3 would
  # overturn that ruling by accident and be permanently red, which is how a check becomes
  # something people switch off.
  #
  # Its own job rather than steps on End-to-end: that one is the fast signal and SPEC.md §5.3
  # prices a sixth file there "in seconds against that bound". This is ~152s (a11y 87s, shots
  # 65s, measured on c3ecb12), and as a job of its own it costs nothing in wall clock.
  instruments:
    name: Instrument health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-24-

      - run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('./packages/builder/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm --filter @linkpage/builder exec playwright install --with-deps --only-shell chromium

      # `--label` rather than the branch name: the scripts derive a port and an output folder
      # from it, and a branch called `main` on two concurrent runs would collide on both.
      # **`node`, not `pnpm shots`, and this is not a style choice.** `pnpm --filter … exec`
      # collapses every non-zero child exit to 1, so through it a finding (3) is indistinguishable
      # from could-not-run (1) — this job would have been permanently red on #318's three rules,
      # which is precisely the failure it is written to avoid. Measured: a script exiting 0/1/2/3
      # comes back from pnpm as 0/1/1/1.
      - name: The appearance ritual reached every frame it declared
        working-directory: packages/builder
        run: |
          set +e
          node scripts/review-shots.mjs --label ci-${{ github.run_id }}
          code=$?
          set -e
          case "$code" in
            0) echo "the set is complete" ;;
            2) echo "::error title=Frames missing::The ritual meant to reach screens it could not. The set is incomplete — see COULD NOT PHOTOGRAPH in the log."; exit 1 ;;
            1) echo "::error title=review-shots could not run::No browser, no server, or no app."; exit 1 ;;
            *) echo "::error title=Unexpected exit $code::review-shots grades itself 0, 1 or 2. Something changed and this job has not been told."; exit 1 ;;
          esac

      - name: The accessibility sweep could see what it swept
        working-directory: packages/builder
        run: |
          set +e
          node scripts/a11y-sweep.mjs --label ci-${{ github.run_id }}
          code=$?
          set -e
          case "$code" in
            0) echo "swept clean" ;;
            3) echo "rules violated — findings for a person, not a gate (#318). Passing deliberately." ;;
            2) echo "::error title=Report cannot be believed::A checker that cannot prove it found something has not reported that nothing is wrong."; exit 1 ;;
            1) echo "::error title=a11y-sweep could not run::No browser, no server, or no app."; exit 1 ;;
            *) echo "::error title=Unexpected exit $code::a11y-sweep grades itself 0, 1, 2 or 3. Something changed and this job has not been told."; exit 1 ;;
          esac

      # Only when it went red: 86 PNGs are pure cost on a green run, and the thing worth looking
      # at when it is red is which frames are missing rather than what the rest look like.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: instrument-output
          path: review-shots/
          retention-days: 7
